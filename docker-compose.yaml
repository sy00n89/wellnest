# Runs the whole Wellnest app on this machine.
#   docker compose up -d --build
# The app is served on port 80; data is kept in the dynamodb-data volume.
# (Antithesis uses its own compose file under antithesis/config/.)
services:
  dynamodb:
    image: amazon/dynamodb-local
    # Save tables to disk instead of memory, so data survives restarts.
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    # The image's default user can't write to a new Docker volume.
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped

  anthropic-mock:
    build: ./mocks/anthropic
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      ENTRIES_TABLE: wellnest-entries
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ANTHROPIC_BASE_URL: http://anthropic-mock:8080
      ANTHROPIC_API_KEY: not-a-real-key
    ports:
      - "8080:8080"
    depends_on:
      - dynamodb
      - anthropic-mock
    restart: unless-stopped

  frontend:
    build: .
    ports:
      - "80:80"
      # Also reachable at https://<vm>.exe.xyz:8081/ (exe.dev forwards 3000-9999)
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dynamodb-data:
