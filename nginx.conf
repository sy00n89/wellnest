server {
    listen 80;

    # The React app: plain static files.
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # API calls: /api/entries -> http://api:8080/entries (the trailing slash
    # on proxy_pass strips the /api prefix, like the Vite proxy does in dev).
    location /api/ {
        proxy_pass http://api:8080/;
    }
}
