# Runs on pull requests, and on pushes to main. If any step fails, the run is red.
# (Running on every push as well would test each PR commit twice.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # A throwaway DynamoDB for the tests, started before the steps run.
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8001:8000
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -v
